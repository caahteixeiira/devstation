services:
  postgres:
    image: postgres:17
    container_name: devstation-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no .env da raiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env da raiz}
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no .env da raiz}

    ports:
      - "5432:5432"

    volumes:
      - devstation_postgres_data:/var/lib/postgresql/data

volumes:
  devstation_postgres_data:
